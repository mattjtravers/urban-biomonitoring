[project]
name = "urbanbio"
version = "0.0.0"
description = "Passive acoustic recordings to validated, standards-aligned species occurrence data."
readme = "README.md"
license = "MIT"
# BirdNET Analyzer depends on TensorFlow, which publishes wheels for CPython <= 3.13.
requires-python = ">=3.12,<3.14"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.13",
]

[tool.uv]
# No importable package yet; src/urbanbio/ arrives with the first approved requirements.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
