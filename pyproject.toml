[project]
name = "urbanbio"
version = "0.0.0"
description = "Passive acoustic recordings to validated, standards-aligned species occurrence data."
readme = "README.md"
license = "MIT"
# birdnet runs the V2.4 model on LiteRT (ai-edge-litert), which publishes wheels for CPython <= 3.13.
requires-python = ">=3.12,<3.14"
dependencies = [
    "birdnet==1.1.1",
    "silero-vad==6.2.3",
    "torch",
    "soundfile",
    "scipy",
    "numpy",
    "pydantic>=2",
    "typer>=0.19",
    "boto3",
    "pyarrow",
    "duckdb",
]

[project.scripts]
urbanbio = "urbanbio.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.13",
    "moto[s3]",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
# CPU-only wheels: the default Linux torch wheel pulls several GB of CUDA libraries.
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["urbanbio", "tests"]
